version: "3.9"

services:
  # ---------- Infrastructure ----------
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
  
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    ports:
      - "9000:9000"
    environment:
      - KAFKA_BROKERCONNECT=kafka:9092
      - SERVER_PORT=9000
      - SERVER_SERVLET_CONTEXTPATH=/
    depends_on:
      kafka:
        condition: service_healthy

  user-db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  event-db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: events
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  commission-db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: commissions
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  wallet-db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wallets
    ports: ["5435:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Services ----------
  user-service:
    build:
      context: .
      dockerfile: src/PartnerSystem.UserService/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Postgres=Host=user-db;Database=users;Username=postgres;Password=postgres
    ports: ["8081:8080"]
    depends_on:
      user-db:
        condition: service_healthy

  event-service:
    build:
      context: .
      dockerfile: src/PartnerSystem.EventService/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Postgres=Host=event-db;Database=events;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=kafka:9092
    ports: ["8082:8080"]
    depends_on:
      event-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  commission-service:
    build:
      context: .
      dockerfile: src/PartnerSystem.CommissionService/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Postgres=Host=commission-db;Database=commissions;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=kafka:9092
      - Services__UserService__BaseUrl=http://user-service:8080
    ports: ["8083:8080"]
    depends_on:
      commission-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_started

  wallet-service:
    build:
      context: .
      dockerfile: src/PartnerSystem.WalletService/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Postgres=Host=wallet-db;Database=wallets;Username=postgres;Password=postgres
      - Services__CommissionService__BaseUrl=http://commission-service:8080
      - Payout__IntervalSeconds=30
    ports: ["8084:8080"]
    depends_on:
      wallet-db:
        condition: service_healthy
      commission-service:
        condition: service_started

  admin-service:
    build:
      context: .
      dockerfile: src/PartnerSystem.AdminService/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - Services__CommissionService__BaseUrl=http://commission-service:8080
      - Services__EventService__BaseUrl=http://event-service:8080
    ports: ["8085:8080"]
    depends_on:
      - commission-service
      - event-service